<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>文笺 · 文献与写作</title><link rel="stylesheet" href="style.css"></head>
<body><header><div><small>RESEARCH & WRITE</small><h1>文笺</h1><p>让阅读沉淀，让思考成文。</p></div><div><button id="backup">备份全部数据</button> <label class="button">恢复备份<input id="restore" type="file" accept="application/json" hidden></label></div></header>
<main><section><div class="heading"><h2>文献库</h2><span id="count"></span></div><input id="search" type="search" placeholder="搜索标题、作者、标签或笔记" aria-label="搜索文献"><div id="papers"></div><details open><summary>添加文献</summary><form id="paper-form"><label>标题<input name="title" required maxlength="500"></label><div class="row"><label>作者<input name="author"></label><label>年份<input name="year" type="number" min="1000" max="9999"></label></div><label>链接 / DOI<input name="url" placeholder="https://… 或 10.…"></label><label>标签（逗号分隔）<input name="tags"></label><label>阅读笔记<textarea name="notes" rows="3"></textarea></label><button class="primary" type="submit">保存文献</button></form></details></section>
<section class="writing"><div class="heading"><h2>写作台</h2><button id="new-draft">新建文章</button></div><select id="drafts" aria-label="选择文章"></select><input id="draft-title" placeholder="文章标题" aria-label="文章标题"><p class="hint">支持 Markdown；点击文献的「引用」可插入作者、年份和文献编号。</p><textarea id="editor" placeholder="从一个问题、一段摘录或一个想法开始……" aria-label="正文"></textarea><details><summary>AI 文献摘要与辅助写作</summary><p class="hint">输入文献摘要、摘录或写作要求。提交后文本将发送至配置的模型服务。生成内容需人工核对。</p><textarea id="ai-input" rows="4" placeholder="粘贴文献内容，或描述写作需求" aria-label="AI 输入"></textarea><div class="actions"><button id="ai-summary">整理文献摘要</button> <button id="ai-write">辅助写作</button></div><textarea id="ai-output" rows="6" readonly aria-label="AI 结果"></textarea><button id="ai-insert">插入正文</button><p id="ai-status" role="status"></p></details><footer><span id="words"></span><div><button id="export">导出 Markdown</button> <button id="delete-draft">删除文章</button></div></footer><p class="hint">数据仅保存在当前浏览器。清理浏览器数据会删除内容，请定期备份。不同设备不会自动同步。</p></section></main><p id="status" role="status" aria-live="polite"></p><script src="app.js"></script></body></html>
